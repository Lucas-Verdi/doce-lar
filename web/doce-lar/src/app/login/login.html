<div class="caixa">
  <a class="voltar" routerLink="/">← Voltar</a>
  <h1>🧁 Entrar</h1>

  <form [formGroup]="form" (ngSubmit)="login()" novalidate>
    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="erro">Informe um e-mail válido.</span>
      }
    </label>

    <label>
      Senha
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="erro">Informe sua senha.</span>
      }
    </label>

    @if (errorMessage()) {
      <p class="erro" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="alt">Não tem conta? <a routerLink="/cadastro">Criar conta</a></p>
</div>
