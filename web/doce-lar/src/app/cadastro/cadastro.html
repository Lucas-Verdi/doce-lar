<div class="caixa">
  <a class="voltar" routerLink="/">← Voltar</a>
  <h1>🧁 Criar conta</h1>

  <form [formGroup]="form" (ngSubmit)="criarConta()" novalidate>
    <label>
      Nome de usuário
      <input type="text" formControlName="username" autocomplete="name" />
            @if (form.controls.username.touched && form.controls.username.invalid) {
        <span class="erro">Informe seu nome de usuário.</span>
      }
    </label>

    <label>
      Nome completo
      <input type="text" formControlName="full_name" autocomplete="name" />
            @if (form.controls.full_name.touched && form.controls.full_name.invalid) {
        <span class="erro">Informe seu nome completo.</span>
      }
    </label>

    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="erro">Informe um e-mail válido.</span>
      }
    </label>

    <label>
      Senha
      <input type="password"       formControlName="password" autocomplete="new-password" />
            @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="erro">A senha deve ter ao menos 6 caracteres.</span>
      }
    </label>

    <label>
      Confirmar senha
      <input type="password" formControlName="confirmar" autocomplete="new-password" />
      @if (form.controls.confirmar.touched && form.hasError('senhasDiferentes')) {
        <span class="erro">As senhas não coincidem.</span>
      }
    </label>

    @if (errorMessage()) {
      <p class="erro" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Criando conta...' : 'Criar conta' }}
    </button>
  </form>

  <p class="alt">Já tem conta? <a routerLink="/login">Entrar</a></p>
</div>
